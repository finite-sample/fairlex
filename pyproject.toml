[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[project]
name = "fairlex"
version = "0.3.0"
description = "Leximin calibration for survey weights"
authors = [
  { name = "Gaurav Sood", email = "contact@gsood.com" },
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26.0",
  "scipy>=1.11.0",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Homepage = "https://github.com/finite-sample/fairlex"
Documentation = "https://finite-sample.github.io/fairlex/"
Repository = "https://github.com/finite-sample/fairlex"
"Bug Tracker" = "https://github.com/finite-sample/fairlex/issues"

[tool.uv.build-backend]
module-name = "fairlex"

[dependency-groups]
dev = [
  "ruff>=0.14",
  "pyright>=1.1.390",
  "pre-commit>=4",
  { include-group = "test" },
]
test = ["pytest>=8", "pytest-cov>=6"]
docs = [
  "sphinx>=8",
  "py-canon @ git+https://github.com/gojiplus/py-canon@v1",
  "furo",
  "myst-parser",
  "myst-nb>=1.2",
  "sphinx-copybutton",
  "pandas>=2.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
external = ["DOC"]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "D", "S", "SIM", "T20", "PT", "RUF", "PTH", "RET", "PIE", "FURB", "PERF", "DTZ", "LOG", "G", "TC", "FLY", "RSE", "SLOT", "FA", "A", "EXE", "ICN", "PGH", "PLE", "ARG", "SLF", "PL"]
# D203/D213: the google convention the fleet standard picks. W191/D206/D300:
# ruff's own docs list these as always incompatible with `ruff format`, which
# the standard also runs.
ignore = ["D203", "D213", "W191", "D206", "D300"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pep8-naming]
# `A` is the membership matrix throughout the calibration literature this
# package implements, and `A_ub` is scipy.optimize.linprog's own parameter
# name. Lowercasing either would make the code harder to check against the
# maths, so the two names are exempt rather than the N rules being dropped.
extend-ignore-names = ["A", "A_ub"]

[tool.ruff.lint.pylint]
# The two public entry points take the LP's data (A, b, w0) plus its bounds
# and slack; splitting them into a config object would only move the argument
# count somewhere else.
max-args = 8

[tool.ruff.lint.per-file-ignores]
# Unused fixture arguments and private-member access are how tests are written.
# PLR2004: assertions compare against literal expected values by design.
"tests/**" = ["S101", "D", "ARG", "SLF", "PLR2004"]
"docs/**" = ["D"]
# T201: printing is how a tutorial notebook produces its rendered output.
"docs/**/*.ipynb" = ["D", "T201"]

[tool.ruff.lint.isort]
known-first-party = ["fairlex"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"
pythonVersion = "3.12"

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-class-attributes = false
allow-init-docstring = true
exclude = '\.venv|tests|docs'

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]

[tool.preen]
